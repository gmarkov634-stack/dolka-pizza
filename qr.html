<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-код — Долька</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell center"><section class="card"><h1>QR-код сайта</h1><div class="help">Наведите камеру телефона, чтобы открыть меню.</div><img id="qr" class="qr" alt="QR-код"><div id="site" class="detail" style="overflow-wrap:anywhere"></div><div class="actions" style="justify-content:center;margin-top:14px"><button class="button primary" onclick="window.print()">Распечатать</button><a class="button" href="./">Открыть сайт</a></div></section></main><script>const u=new URL('./',location.href).href;document.getElementById('site').textContent=u;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=700x700&margin=20&ecc=M&format=png&data='+encodeURIComponent(u)</script></body></html>
