<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Статус заказа — Долька</title><meta name="theme-color" content="#ea580c"><link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png"><link rel="stylesheet" href="./styles.css?v=5"></head><body><main class="shell"><header class="topbar"><div class="brand"><h1>Статус заказа</h1><div class="meta">Пиццерия Долька</div></div><a class="button" href="./">Вернуться в меню</a></header><section class="card"><div class="form-grid"><label>Номер заказа<input id="orderId" placeholder="PZ-20260804-001"></label><label id="phoneField">Телефон<span class="phone"><span>+7</span><input id="phone" inputmode="numeric" maxlength="13" placeholder="953 949-06-02"></span></label></div><div class="actions" style="margin-top:13px"><button id="check" class="button primary">Проверить</button><button id="refresh" class="button hidden">Обновить</button></div><div id="feedback" class="feedback"></div></section><section id="result" class="card hidden" style="margin-top:16px"><div class="topbar"><div><h2 id="resultId" style="margin:0"></h2><div id="created" class="meta"></div></div><span id="status" class="badge warn"></span></div><div id="progressBlock" class="order-progress-block" aria-live="polite">
  <div class="progress-heading">
    <strong>Этап выполнения заказа</strong>
    <span id="progressPercent" class="progress-percent"></span>
  </div>
  <div id="orderProgress" class="order-progress"></div>
  <div id="progressMessage" class="progress-message"></div>
</div>
<div class="status-grid"><div class="detail"><span>Получение</span><strong id="delivery"></strong></div><div class="detail"><span>Оплата</span><strong id="payment"></strong></div><div class="detail"><span>Сумма</span><strong id="total"></strong></div><div class="detail"><span>Обновлён</span><strong id="updated"></strong></div></div><a id="pay" class="button primary hidden" style="margin-top:14px">Перейти к оплате СБП</a><div id="items" style="margin-top:14px"></div></section></main><script src="./config.js"></script><script type="module" src="./status.js?v=3"></script></body></html>
